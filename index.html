<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a102d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="le jeu de la biche">
    <link rel="apple-touch-icon" href="Images/disco_biche_icon.png" sizes="1254x1254">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Le jeu de la biche</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/timer.css">
    <link rel="stylesheet" href="css/transition.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div id="home-screen">
        <h1 id="home-title">Le jeu de la biche</h1>
        <div id="high-score-container">
            <span class="high-score-label">RECORD</span>
            <span id="high-score-value">0</span>
        </div>
        <button id="start-button">DÉMARRER</button>
    </div>
    <div id="game-container">
        <div id="fixed-instruction-box"> PRÊT ? </div>
        <div id="screen-frame">
            <div id="screen-inner">
                <div id="transition-screen">
                    <div id="transition-bg"></div>
                    <div id="biche-runner"></div>
                    <div id="level-display">1</div>
                    <div id="lives-container"></div>
                    <div id="speed-up-label">SPEED UP!</div>
                    <div id="leaderboard" class="hidden"></div>
                </div>
                <canvas id="game-canvas" width="800" height="600"></canvas>
                <div id="ui-layer">
                    <!-- Game UI elements (score, timer, etc.) will go here -->
                    <div id="timer"></div>
                    <div id="instruction"></div>
                    <div id="bomb-timer-container">
                        <div id="bomb-visuals">
                            <div id="fuse-container">
                                <div id="fuse-segments">
                                    <div class="fuse-segment" id="seg-4"></div>
                                    <div class="fuse-segment" id="seg-3"></div>
                                    <div class="fuse-segment" id="seg-2"></div>
                                    <div class="fuse-segment" id="seg-1"></div>
                                </div>
                                <div id="fuse-tip"></div>
                            </div>
                            <div id="bomb-sprite">
                                <div id="explosion-sprite"></div>
                            </div>
                        </div>
                    </div>

                    <div id="touch-controls" aria-label="Contrôles tactiles">
                        <div id="flight-controls" class="touch-control-set" aria-label="Contrôles de vol">
                            <button type="button" class="touch-control up" data-control="ArrowUp" aria-label="Monter">▲</button>
                            <div class="touch-control-row">
                                <button type="button" class="touch-control" data-control="ArrowLeft" aria-label="Aller à gauche">◀</button>
                                <button type="button" class="touch-control" data-control="ArrowDown" aria-label="Descendre">▼</button>
                                <button type="button" class="touch-control" data-control="ArrowRight" aria-label="Aller à droite">▶</button>
                            </div>
                        </div>
                        <div id="running-controls" class="touch-control-set" aria-label="Contrôles de course">
                            <button type="button" class="touch-control" data-control="ArrowLeft" aria-label="Courir à gauche">◀</button>
                            <button type="button" class="touch-control" data-control="ArrowRight" aria-label="Courir à droite">▶</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dev Tools Overlay -->
    <div id="dev-tools">
        <h3>Dev Tools</h3>
        <select id="game-selector">
            <option value="">Sélectionner un jeu...</option>
            <!-- Options will be populated by JS -->
        </select>
        <button id="start-game-btn">Lancer</button>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
